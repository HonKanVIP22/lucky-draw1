<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Lucky Draw Pro</title>

<style>
body{
  background:url("nen.jpg") center/cover no-repeat fixed;
  font-family:'Segoe UI',Arial;
  color:#fff;
  text-align:center;
  margin:0;
  min-height:100vh;
}
.overlay{
  background:rgba(0,0,0,0.35);
  min-height:100vh;
  padding-top:50px;
}

/* ===== TITLE ===== */
h1{
  font-size:clamp(36px,4vw,52px);
  font-weight:900;
  letter-spacing:2px;
  margin-bottom:22px;
  background:linear-gradient(90deg,#fff4b0,#ffdf55,#ffc52d);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
  filter:drop-shadow(0 2px 5px rgba(4,20,48,.5));
}
.title-icon{
  display:inline-block;
  animation:rotateSlow 8s linear infinite;
  margin-right:14px;
}

/* ===== SLOT ===== */
.slot{
  display:flex;
  justify-content:center;
  gap:12px;
  margin:22px 0 18px;
}
.digit{
  width:64px;
  height:88px;
  box-sizing:border-box;
  background:linear-gradient(155deg,rgba(18,62,112,.68),rgba(8,34,69,.48));
  border:2px solid rgba(255,218,94,.82);
  color:#fff4c8;
  font-size:54px;
  font-weight:900;
  border-radius:14px;
  display:flex;
  align-items:center;
  justify-content:center;
  text-shadow:0 2px 8px rgba(0,0,0,.45);
  box-shadow:0 5px 14px rgba(5,20,45,.18);
  backdrop-filter:blur(3px);
}

/* ===== SPIN BUTTON ===== */
#spinBtn{
  width:148px;
  height:148px;
  border-radius:50%;
  background:radial-gradient(circle at 35% 30%,rgba(255,235,112,.94),rgba(255,181,0,.8));
  color:#63450c;
  font-size:29px;
  font-weight:900;
  border:2px solid rgba(255,255,255,.55);
  box-shadow:0 9px 22px rgba(24,27,18,.2),inset 0 0 16px rgba(255,255,255,.16);
  backdrop-filter:blur(3px);
  cursor:pointer;
  transition:transform .18s ease,filter .18s ease;
}
#spinBtn:hover{transform:scale(1.035);filter:brightness(1.04)}

/* ===== COMPACT CONTROL BAR ===== */
.right-panel{
  position:fixed;
  z-index:1000;
  top:16px;
  right:16px;
  display:flex;
  flex-direction:row;
  flex-wrap:wrap;
  align-items:center;
  justify-content:flex-end;
  gap:6px;
  max-width:calc(100vw - 32px);
  box-sizing:border-box;
  padding:8px;
  border:1px solid rgba(255,255,255,.16);
  border-radius:18px;
  background:rgba(28,31,37,.68);
  box-shadow:0 8px 24px rgba(0,0,0,.2);
  backdrop-filter:blur(12px);
}
.right-panel select,
.right-panel input[type=number]{
  height:40px;
  box-sizing:border-box;
  padding:0 9px;
  border:1px solid rgba(255,255,255,.12);
  border-radius:12px;
  background:#4b4b4b;
  color:#fff;
  text-align:center;
  font:700 14px 'Segoe UI',Arial,sans-serif;
}
#prize{width:108px}
#drawCount{width:48px}
.right-panel button,
.import-menu>summary{
  display:flex;
  align-items:center;
  justify-content:center;
  height:40px;
  box-sizing:border-box;
  padding:0 11px;
  border:0;
  border-radius:20px;
  cursor:pointer;
  white-space:nowrap;
  font:700 14px 'Segoe UI',Arial,sans-serif;
  transition:transform .15s ease,filter .15s ease;
}
.right-panel button:hover,
.import-menu>summary:hover{filter:brightness(1.08);transform:translateY(-1px)}
.right-panel button:disabled,
#spinBtn:disabled,
.import-menu.locked>summary{opacity:.55;cursor:not-allowed;pointer-events:none}
.export{background:#d50000;color:#fff}
.reset{background:#0d47a1;color:#fff}
.import-menu{position:relative}
.import-menu>summary{
  list-style:none;
  background:linear-gradient(135deg,#ffe66d,#ffbd26);
  color:#4b3510;
}
.import-menu>summary::-webkit-details-marker{display:none}
.import-menu>summary::after{content:"⌄";margin-left:5px;font-size:16px;line-height:1}
.import-menu[open]>summary{box-shadow:0 0 0 2px rgba(255,224,102,.25)}
.import-popover{
  position:absolute;
  top:calc(100% + 9px);
  right:0;
  z-index:1001;
  display:grid;
  gap:10px;
  width:232px;
  padding:14px;
  box-sizing:border-box;
  border:1px solid rgba(255,224,102,.3);
  border-radius:16px;
  background:rgba(29,31,36,.96);
  box-shadow:0 14px 36px rgba(0,0,0,.35);
  text-align:left;
  backdrop-filter:blur(14px);
}
.import-popover label{display:grid;gap:6px;font-size:12px;color:#ddd}
.import-popover select{
  width:100%;
  height:38px;
  box-sizing:border-box;
  padding:0 10px;
  border:1px solid rgba(255,255,255,.14);
  border-radius:10px;
  background:#41434a;
  color:#fff;
  font:600 13px 'Segoe UI',Arial,sans-serif;
}
.import-popover button{width:100%;height:38px;border-radius:10px;background:#ffca28;color:#46330d}
.import-popover .template-button{height:32px;background:transparent;color:#ffe082;border:1px solid rgba(255,224,102,.25)}
#excelFile{display:none}
#participantCount{font-size:12px;font-weight:700;color:#ffeb3b}
#importStatus{min-height:1.3em;margin:0;font-size:12px;line-height:1.4;color:#ddd}
@media(max-width:700px){
  .overlay{padding-top:28px}
  h1{font-size:clamp(30px,8vw,44px);letter-spacing:1px}
  .right-panel{position:static;margin:12px auto;width:max-content;max-width:calc(100vw - 24px);justify-content:center}
  #spinBtn{width:126px;height:126px;font-size:25px}
  .digit{width:44px;height:64px;font-size:36px}
}

/* ===== BATCH WINNER CELEBRATION ===== */
#winnerBox{
  display:none;
  position:fixed;
  inset:0;
  z-index:9999;
  align-items:center;
  justify-content:center;
  box-sizing:border-box;
  padding:16px;
  background:rgba(3,10,28,.7);
}
#fireworksArea{position:absolute;inset:0;overflow:hidden;pointer-events:none}
#winnerContent{
  position:relative;
  z-index:1;
  display:flex;
  flex-direction:column;
  align-items:center;
  width:min(740px,94vw);
  max-height:88vh;
  box-sizing:border-box;
  padding:28px;
  overflow:hidden;
  border:1px solid rgba(255,220,105,.72);
  border-radius:26px;
  background:linear-gradient(155deg,rgba(10,29,61,.97),rgba(24,24,42,.95));
  box-shadow:0 0 48px rgba(255,199,42,.42),0 20px 60px rgba(0,0,0,.45);
}
#winnerContent h2{
  margin:0 0 8px;
  color:#ffe16b;
  font-size:clamp(25px,4vw,36px);
  text-shadow:0 2px 10px rgba(255,191,0,.24);
}
#winnerIntro{font-size:16px;font-weight:700;line-height:1.6;color:#fff;text-align:center;white-space:pre-line}
#winnerBatchList{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:8px;
  width:100%;
  max-height:54vh;
  margin:14px 0;
  padding:2px 5px 2px 2px;
  overflow-y:auto;
  box-sizing:border-box;
  text-align:left;
}
.winner-row{
  display:flex;
  flex-direction:column;
  gap:3px;
  padding:9px 11px;
  border:1px solid rgba(255,255,255,.1);
  border-radius:12px;
  background:rgba(255,255,255,.08);
}
.winner-row strong{color:#fff;font-size:15px}
.winner-row span{color:#ffe082;font-size:13px}
#closeWinnerBtn{
  min-width:130px;
  padding:10px 22px;
  border:0;
  border-radius:999px;
  background:linear-gradient(135deg,#ffe66d,#ffbd26);
  color:#4b3510;
  font:800 15px 'Segoe UI',Arial,sans-serif;
  cursor:pointer;
}
#closeWinnerBtn:hover{filter:brightness(1.08);transform:translateY(-1px)}
.firework-burst{position:absolute;width:1px;height:1px}
.firework-particle{
  position:absolute;
  top:0;
  left:0;
  width:6px;
  height:6px;
  border-radius:50%;
  background:var(--color);
  box-shadow:0 0 9px var(--color),0 0 18px var(--color);
  animation:firework-explode 1.45s ease-out forwards;
}
@keyframes firework-explode{
  0%{transform:translate(0,0) scale(1);opacity:1}
  100%{transform:translate(var(--dx),var(--dy)) scale(.08);opacity:0}
}
@media(max-width:700px){
  #winnerContent{padding:22px 14px;border-radius:20px}
  #winnerBatchList{grid-template-columns:1fr;max-height:58vh}
  #winnerIntro{font-size:14px}
}

/* ===== SPARKLE ===== */
.sparkle{
  position:absolute;
  font-size:26px;
  animation:sparkle 1.5s ease-in-out infinite;
}

/* ===== CONFETTI ===== */
.confetti{
  position:absolute;
  font-size:26px;
  animation:floatUp 2.8s linear infinite;
}

/* ===== RESULT ===== */
.result-box{
  margin:30px auto;
  width:min(88%,760px);
  max-width:760px;
  box-sizing:border-box;
  background:linear-gradient(135deg,rgba(10,37,74,.36),rgba(14,53,77,.24));
  border:1px solid rgba(255,255,255,.2);
  border-radius:22px;
  padding:14px 20px;
  box-shadow:0 10px 30px rgba(7,18,44,.2);
  backdrop-filter:blur(4px);
}
.result-box h2{
  margin:0 0 8px;
  font-size:22px;
  text-shadow:0 2px 8px rgba(0,0,0,.55);
}
.result-box th,
.result-box td{
  padding:10px 12px;
  text-shadow:0 1px 3px rgba(0,0,0,.5);
}
.result-box thead th{
  color:#fff5ce;
  border-bottom:1px solid rgba(255,255,255,.18);
}
@media(max-width:700px){
  .result-box{
    width:calc(100% - 28px);
    max-width:none;
    margin:24px auto;
    padding:12px 10px;
    border-radius:17px;
  }
  .result-box h2{font-size:18px}
  .result-box th,.result-box td{padding:8px 5px;font-size:13px}
  .result-box .code{font-size:15px}
}
table{width:100%;border-collapse:collapse}
th,td{padding:14px}
.prize{color:#ffd54f;font-weight:800}
.code{font-family:monospace;font-size:20px}

/* ===== THAN TAI ===== */
.thantai-box{
  position:fixed;
  right:20px;
  bottom:40px;
  width:240px;
  z-index:998;
  text-align:center;
  animation:thantaiSwing 3s ease-in-out infinite;
}
.thantai-box img{
  width:100%;
  filter:drop-shadow(0 10px 25px rgba(0,0,0,.6));
}
.thantai-text{
  background:linear-gradient(90deg,#ffeb3b,#ffc107);
  color:#5d4037;
  font-weight:900;
  padding:8px 14px;
  border-radius:20px;
  margin-bottom:6px;
  display:inline-block;
  animation:textBounce 1.6s ease-in-out infinite;
  box-shadow:0 6px 18px rgba(0,0,0,.4);
}

  /* ===== HORSE STAND (NGỰA ĐỨNG) ===== */
.horse-stand{
  position:fixed;
  left:20px;
  bottom:40px;       /* BẰNG bottom của thần tài */
  width:240px;       /* BẰNG width của thần tài */
  z-index:998;
  text-align:center;
}
.horse-stand img{
  width:100%;
  filter:drop-shadow(0 10px 25px rgba(0,0,0,.6));
}
.horse-text{
  background:linear-gradient(90deg,#ffeb3b,#ffc107);
  color:#5d4037;
  font-weight:900;
  padding:8px 14px;
  border-radius:20px;
  margin-bottom:6px;
  display:inline-block;
  box-shadow:0 6px 18px rgba(0,0,0,.4);
}

/* ===== HORSE RUN ===== */
.horse-run{
  position:fixed;
  top:20px;
  left:-220px;
  width:300px;
  z-index:50;
  animation:horseRun 12s linear infinite;
  pointer-events:none;
}
.horse-run img{
  width:75%;
  filter:drop-shadow(0 10px 20px rgba(0,0,0,.6));
}
/* ==== GOM KẾT QUẢ THEO ĐỢT ==== */
.round-header{
  cursor:pointer;
  background:rgba(255,215,0,.15);
  font-weight:900;
}
.round-header:hover{
  background:rgba(255,215,0,.3);
}
.round-detail{
  display:none;
}
/* ===== ANIMATIONS ===== */
@keyframes floatUp{
  from{transform:translateY(0) rotate(0);opacity:1}
  to{transform:translateY(-140px) rotate(360deg);opacity:0}
}
@keyframes sparkle{
  0%,100%{opacity:.2;transform:scale(.8)}
  50%{opacity:1;transform:scale(1.2)}
}
@keyframes rotateSlow{
  from{transform:rotate(0deg)}
  to{transform:rotate(360deg)}
}
@keyframes thantaiSwing{
  0%,100%{transform:rotate(-5deg)}
  50%{transform:rotate(5deg)}
}
@keyframes textBounce{
  0%,100%{transform:translateY(0)}
  50%{transform:translateY(-6px)}
}
@keyframes horseRun{
  from{left:-220px;}
  to{left:110%;}
}
</style>
</head>

<body>

<div class="right-panel">
  <select id="prize">
    <option>Giải Nhất</option>
    <option>Giải Nhì</option>
    <option>Giải Ba</option>
    <option>Giải Thưởng</option>
  </select>
  <input id="drawCount" type="number" value="1" min="1" aria-label="Số người quay">
  <details id="importMenu" class="import-menu">
    <summary title="Nhập danh sách Excel hoặc CSV">📥 Nhập Excel</summary>
    <div class="import-popover">
      <label for="importMode">Cách nhập danh sách
        <select id="importMode">
          <option value="replace">Thay danh sách còn lại</option>
          <option value="append">Nối vào danh sách còn lại</option>
        </select>
      </label>
      <input id="excelFile" type="file" accept=".xlsx,.xls,.csv" onchange="importExcelList(event)">
      <button id="pickExcelBtn" type="button" onclick="document.getElementById('excelFile').click()">Chọn file Excel</button>
      <button id="templateBtn" class="template-button" type="button" onclick="downloadExcelTemplate()">⬇ Tải file mẫu</button>
      <div id="participantCount" aria-live="polite"></div>
      <p id="importStatus" aria-live="polite">Cần có cột Mã số và Họ tên; có thể thêm cột Bộ phận. Mã có số 0 đầu nên để dạng văn bản.</p>
    </div>
  </details>
  <button id="exportBtn" class="export" onclick="exportExcel()">📥 Xuất Excel</button>
  <button id="resetBtn" class="reset" onclick="resetAll()">🔄 Reset</button>
</div>

<div id="winnerBox">
  <div id="fireworksArea" aria-hidden="true"></div>
  <div id="winnerContent">
    <div class="sparkle" style="top:10px;left:14px;">✨</div>
    <div class="sparkle" style="top:10px;right:14px;animation-delay:.5s">✨</div>
    <h2>🎉 CHÚC MỪNG! 🎉</h2>
    <div id="winnerIntro"></div>
    <div id="winnerBatchList"></div>
    <button id="closeWinnerBtn" type="button">Đóng</button>
  </div>
</div>

<div id="confettiArea"></div>

<div class="overlay">

<h1><span class="title-icon">🎯</span>QUAY SỐ MAY MẮN</h1>

<div class="slot">
  <div class="digit">0</div><div class="digit">0</div>
  <div class="digit">0</div><div class="digit">0</div>
  <div class="digit">0</div>
</div>

<button id="spinBtn" onclick="draw()">QUAY</button>

<div class="result-box">
  <h2>🏆 DANH SÁCH TRÚNG THƯỞNG</h2>
  <table>
    <thead>
      <tr><th>Giải</th><th>Mã số</th><th>Họ tên</th><th>Bộ phận</th></tr>
    </thead>
    <tbody id="resultTable"></tbody>
  </table>
</div>

</div>

<script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>
<script>
const defaultItems=[
{code:"88888", name:"Tên - BP"},
];

let items=JSON.parse(localStorage.getItem("ITEMS"))||[...defaultItems];
let results=JSON.parse(localStorage.getItem("RESULTS"))||[];
let round=parseInt(localStorage.getItem("ROUND"))||1;
let isDrawing=false;
let isImporting=false;
window.onload=()=>{renderTable();updateParticipantCount();};

function prepareDigits(count){
  const slot=document.querySelector(".slot");
  const total=Math.max(5,count);
  if(slot.children.length!==total){
    slot.innerHTML=Array.from({length:total},()=>'<div class="digit">0</div>').join("");
  }
}

function spinDigits(target){
  const code=String(target.code);
  prepareDigits(code.length);
  const digits=document.querySelectorAll(".digit");
  let tick=0;
  return new Promise(resolve=>{
    const timer=setInterval(()=>{
      digits.forEach(digit=>digit.textContent=Math.floor(Math.random()*10));
      if(++tick>=40){
        clearInterval(timer);
        [...code.padStart(digits.length,"0")].forEach((n,index)=>digits[index].textContent=n);
        resolve();
      }
    },100);
  });
}

function setDrawControlsLocked(locked){
  ["spinBtn","prize","drawCount","excelFile","importMode","pickExcelBtn","exportBtn","resetBtn","templateBtn"].forEach(id=>{
    const control=document.getElementById(id);
    if(control) control.disabled=locked;
  });
  const menu=document.getElementById("importMenu");
  if(menu) menu.classList.toggle("locked",locked);
}

function saveState(){
  localStorage.setItem("ITEMS",JSON.stringify(items));
  localStorage.setItem("RESULTS",JSON.stringify(results));
  localStorage.setItem("ROUND",String(round));
}

function randomIndex(maxExclusive){
  if(!Number.isInteger(maxExclusive)||maxExclusive<1||maxExclusive>0x100000000){
    throw new RangeError("Kích thước danh sách không hợp lệ.");
  }
  const cryptoProvider=globalThis.crypto;
  if(!cryptoProvider||typeof cryptoProvider.getRandomValues!=="function"){
    throw new Error("Trình duyệt không hỗ trợ bộ tạo số ngẫu nhiên an toàn.");
  }
  const range=0x100000000;
  const limit=range-(range%maxExclusive);
  const buffer=new Uint32Array(1);
  let value;
  do{
    cryptoProvider.getRandomValues(buffer);
    value=buffer[0];
  }while(value>=limit);
  return value%maxExclusive;
}

async function draw(){
  if(isDrawing||isImporting) return;
  const count=Number(drawCount.value);
  if(!Number.isInteger(count)||count<1){alert("Vui lòng nhập số người quay hợp lệ.");return;}
  if(count>items.length){alert("Số người còn lại không đủ để quay.");return;}
  if(!globalThis.crypto||typeof globalThis.crypto.getRandomValues!=="function"){
    alert("Trình duyệt không hỗ trợ bộ tạo số ngẫu nhiên an toàn. Hãy mở trang bằng Chrome hoặc Edge mới nhất.");
    return;
  }

  isDrawing=true;
  setDrawControlsLocked(true);
  spinBtn.textContent="ĐANG QUAY...";
  const prizeValue=prize.value;
  const currentRound=round;
  const eligibleCount=items.length;
  const drawnAt=new Date().toISOString();

  try{
    const remaining=[...items];
    const winners=[];
    for(let k=0;k<count;k++){
      const index=randomIndex(remaining.length);
      winners.push(remaining.splice(index,1)[0]);
    }
    items=remaining;
    round=currentRound+1;
    results.push(...winners.map(item=>({
      ...item,
      prize:prizeValue,
      round:currentRound,
      eligibleCount,
      drawnAt,
      randomMethod:"Web Crypto"
    })));
    saveState();
    await spinDigits(winners[winners.length-1]);
    renderTable();
    updateParticipantCount();
    await showWinnerBatch(winners,prizeValue,currentRound,eligibleCount,drawnAt);
  }catch(error){
    alert(error.message||"Không thể hoàn tất lượt quay. Vui lòng thử lại.");
  }finally{
    isDrawing=false;
    setDrawControlsLocked(false);
    spinBtn.textContent="QUAY";
    updateParticipantCount();
  }
}

let finishWinnerModal=null;
let fireworksInterval=null;
let fireworkTimeout=null;

function showWinnerBatch(winners,prizeValue,roundNo,eligibleCount,drawnAt){
  const list=document.getElementById("winnerBatchList");
  list.replaceChildren();
  winners.forEach((item,index)=>{
    const row=document.createElement("div");
    row.className="winner-row";
    const name=document.createElement("strong");
    name.textContent=`${index+1}. ${item.name}`;
    const detail=document.createElement("span");
    detail.textContent=`Mã số: ${item.code}${item.department?" · "+item.department:""}`;
    row.append(name,detail);
    list.appendChild(row);
  });
  const chance=(winners.length/eligibleCount*100).toLocaleString("vi-VN",{maximumFractionDigits:2});
  const drawTime=new Date(drawnAt).toLocaleString("vi-VN");
  document.getElementById("winnerIntro").textContent=`Chúc mừng những anh chị có tên sau (${winners.length} người) · ${prizeValue} · Đợt ${roundNo}\nTừ ${eligibleCount} người đủ điều kiện · Xác suất mỗi người ${chance}% · ${drawTime}`;
  document.getElementById("winnerBox").style.display="flex";
  startFireworks();
  return new Promise(resolve=>{finishWinnerModal=resolve;});
}

function launchFirework(){
  const area=document.getElementById("fireworksArea");
  const burst=document.createElement("div");
  burst.className="firework-burst";
  burst.style.left=`${8+Math.random()*84}%`;
  burst.style.top=`${12+Math.random()*62}%`;
  const colors=["#ffe66d","#ff5a7a","#70e1ff","#b78aff","#8dffb0"];
  const particleCount=28;
  for(let i=0;i<particleCount;i++){
    const particle=document.createElement("span");
    particle.className="firework-particle";
    const angle=i*2*Math.PI/particleCount;
    const distance=48+Math.random()*76;
    particle.style.setProperty("--dx",`${Math.cos(angle)*distance}px`);
    particle.style.setProperty("--dy",`${Math.sin(angle)*distance}px`);
    particle.style.setProperty("--color",colors[Math.floor(Math.random()*colors.length)]);
    burst.appendChild(particle);
  }
  area.appendChild(burst);
  setTimeout(()=>burst.remove(),1550);
}

function startFireworks(){
  if(fireworksInterval) clearInterval(fireworksInterval);
  const area=document.getElementById("fireworksArea");
  area.replaceChildren();
  launchFirework();
  fireworkTimeout=setTimeout(launchFirework,220);
  fireworksInterval=setInterval(launchFirework,760);
}

function closeWinnerBatch(){
  document.getElementById("winnerBox").style.display="none";
  if(fireworksInterval){clearInterval(fireworksInterval);fireworksInterval=null;}
  if(fireworkTimeout){clearTimeout(fireworkTimeout);fireworkTimeout=null;}
  document.getElementById("fireworksArea").replaceChildren();
  const resolve=finishWinnerModal;
  finishWinnerModal=null;
  if(resolve) resolve();
}

document.getElementById("closeWinnerBtn").addEventListener("click",closeWinnerBatch);
document.getElementById("winnerBox").addEventListener("click",event=>{
  if(event.target.id==="winnerBox"||event.target.id==="fireworksArea") closeWinnerBatch();
});
document.addEventListener("keydown",event=>{
  if(event.key==="Escape"&&document.getElementById("winnerBox").style.display==="flex") closeWinnerBatch();
});


function renderTable(){
  resultTable.innerHTML="";
  let grouped={};

  results.forEach(r=>{
    let key=`${r.prize} - Đợt ${r.round}`;
    if(!grouped[key]) grouped[key]=[];
    grouped[key].push(r);
  });

  const latestResult=results[results.length-1];
  const latestGroupKey=latestResult?`${latestResult.prize} - Đợt ${latestResult.round}`:null;

  Object.keys(grouped).forEach(key=>{
    let cls="r"+Math.random().toString(36).substr(2,6);
    const isLatest=key===latestGroupKey;
    const eligibleCount=grouped[key][0].eligibleCount;
    const eligibleNote=eligibleCount?` / ${eligibleCount} đủ điều kiện`:"";

    resultTable.innerHTML+=`
      <tr class="round-header" onclick="toggle('${cls}')">
        <td colspan="4">▶ ${escapeHtml(key)} (${grouped[key].length} người${eligibleNote})</td>
      </tr>
    `;

    grouped[key].forEach(r=>{
      resultTable.innerHTML+=`
        <tr class="round-detail ${cls}" style="display:${isLatest?"table-row":"none"}">
          <td>${escapeHtml(r.prize)}</td>
          <td class="code">${escapeHtml(r.code)}</td>
          <td>${escapeHtml(r.name)}</td>
          <td>${escapeHtml(r.department||"—")}</td>
        </tr>
      `;
    });
  });
}
function escapeHtml(value){
  return String(value??"").replace(/[&<>"']/g,char=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[char]));
}

function toggle(cls){
  document.querySelectorAll("."+cls).forEach(r=>{
    r.style.display = r.style.display==="table-row" ? "none":"table-row";
  });
}
function exportCSV(){
  let csv="Prize,Code,Name\n";
  results.forEach(r=>csv+=`${r.prize},${r.code},${r.name}\n`);
  let a=document.createElement("a");
  a.href=URL.createObjectURL(new Blob([csv]));
  a.download="ketqua_quayso.csv";
  a.click();
}
function exportExcel(){
  if(results.length===0){
    alert("Chưa có dữ liệu để xuất");
    return;
  }

  let data = results.map(r => ({
    "Giải": r.prize,
    "Đợt": r.round,
    "Mã số": r.code,
    "Họ tên": r.name,
    "Bộ phận": r.department||"",
    "Số người đủ điều kiện": r.eligibleCount??"",
    "Thời điểm ghi nhận": r.drawnAt?new Date(r.drawnAt).toLocaleString("vi-VN"):"",
    "Nguồn ngẫu nhiên": r.randomMethod||""
  }));

  let ws = XLSX.utils.json_to_sheet(data);
  let wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, "Kết quả");

  XLSX.writeFile(wb, "ketqua_quayso.xlsx");
}

async function importExcelList(event){
  const file=event.target.files?.[0];
  if(!file) return;
  if(isDrawing||isImporting){alert("Vui lòng đợi thao tác hiện tại kết thúc rồi nhập danh sách.");event.target.value="";return;}
  if(typeof XLSX==="undefined"){alert("Không tải được thư viện đọc Excel. Hãy kiểm tra kết nối Internet rồi tải lại trang.");event.target.value="";return;}
  const mode=document.getElementById("importMode").value;
  isImporting=true;
  setDrawControlsLocked(true);
  document.getElementById("importStatus").textContent="Đang đọc file...";

  try{
    const workbook=XLSX.read(await file.arrayBuffer(),{type:"array"});
    const firstSheet=workbook.Sheets[workbook.SheetNames[0]];
    const rows=XLSX.utils.sheet_to_json(firstSheet,{header:1,defval:"",raw:false});
    if(!rows.length) throw new Error("File không có dữ liệu.");

    const normalizeHeader=value=>String(value??"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/đ/g,"d").replace(/Đ/g,"D").toLowerCase().replace(/[^a-z0-9]/g,"");
    const codeHeaders=new Set(["maso","ma","code","id","manv","idnhanvien","manhanvien","manguoithamgia","employeeid","sbd"]);
    const nameHeaders=new Set(["hoten","hotennhanvien","hovaten","ten","name","fullname","tennhanvien","tennguoithamgia"]);
    const departmentHeaders=new Set(["bophan","department","dept","phongban","donvi","team","workgroup"]);
    const firstRow=rows[0].map(normalizeHeader);
    const codeColumn=firstRow.findIndex(value=>codeHeaders.has(value));
    const nameColumn=firstRow.findIndex(value=>nameHeaders.has(value));
    const departmentColumn=firstRow.findIndex(value=>departmentHeaders.has(value));
    const hasHeader=codeColumn>=0&&nameColumn>=0;
    const codeIndex=hasHeader?codeColumn:0;
    const nameIndex=hasHeader?nameColumn:1;
    const departmentIndex=departmentColumn>=0?departmentColumn:(hasHeader?-1:2);
    const dataRows=hasHeader?rows.slice(1):rows;
    const seen=new Set();
    const imported=[];
    let skipped=0;

    dataRows.forEach(row=>{
      const code=String(row[codeIndex]??"").trim();
      const name=String(row[nameIndex]??"").trim();
      const department=departmentIndex>=0?String(row[departmentIndex]??"").trim():"";
      if(!code&&!name&&!department) return;
      if(!code||!name){skipped++;return;}
      const key=code.toLocaleLowerCase();
      if(seen.has(key)){skipped++;return;}
      seen.add(key);
      imported.push({code,name,department});
    });
    if(!imported.length) throw new Error("Không tìm thấy dòng hợp lệ. Cần có mã số và họ tên ở hai cột đầu, hoặc tiêu đề tương ứng.");

    if(mode==="replace"&&!confirm(`Thay danh sách còn lại bằng ${imported.length} người từ file này?`)){event.target.value="";return;}
    if(mode==="replace") items=[];
    const existing=new Set(results.map(item=>String(item.code).trim().toLocaleLowerCase()));
    items.forEach(item=>existing.add(String(item.code).trim().toLocaleLowerCase()));
    let added=0;
    imported.forEach(item=>{
      const key=item.code.toLocaleLowerCase();
      if(existing.has(key)){skipped++;return;}
      existing.add(key);items.push(item);added++;
    });
    localStorage.setItem("ITEMS",JSON.stringify(items));
    updateParticipantCount();
    const extra=skipped?` Bỏ qua ${skipped} dòng trống, thiếu dữ liệu hoặc trùng mã.`:"";
    document.getElementById("importStatus").textContent=`Đã nhập ${added} người. Còn ${items.length} người trong danh sách.${extra}`;
    document.getElementById("importStatus").style.color="#c8e6c9";
  }catch(error){
    document.getElementById("importStatus").textContent=error.message||"Không đọc được file Excel.";
    document.getElementById("importStatus").style.color="#ffcdd2";
  }finally{
    event.target.value="";
    isImporting=false;
    setDrawControlsLocked(false);
    document.getElementById("importMenu").open=false;
  }
}

function updateParticipantCount(){
  const count=document.getElementById("participantCount");
  if(count) count.textContent=`Danh sách còn ${items.length} người chưa trúng thưởng.`;
}

function downloadExcelTemplate(){
  if(typeof XLSX==="undefined"){alert("Không tải được thư viện Excel. Hãy kiểm tra kết nối Internet rồi thử lại.");return;}
  const sheet=XLSX.utils.aoa_to_sheet([["Mã số","Họ tên","Bộ phận"]]);
  sheet["!cols"]=[{wch:16},{wch:36},{wch:24}];
  const workbook=XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(workbook,sheet,"Danh sách");
  XLSX.writeFile(workbook,"mau_danh_sach_quay_so.xlsx");
}

function resetAll(){
  if(isDrawing||isImporting) return;
  if(!confirm("RESET toàn bộ kết quả và khôi phục danh sách mặc định?")) return;
  localStorage.removeItem("ITEMS");
  localStorage.removeItem("RESULTS");
  localStorage.removeItem("ROUND");
  items=[...defaultItems];
  results=[];
  round=1;
  renderTable();
  updateParticipantCount();
  prepareDigits(5);
  document.querySelectorAll(".digit").forEach(d=>d.textContent="0");
  document.getElementById("importStatus").textContent="";
}

document.addEventListener("click",event=>{
  const menu=document.getElementById("importMenu");

});
